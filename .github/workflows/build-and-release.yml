name: Build and Release Windows Installer

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyy.MM.dd"
          $version = "$date-$($env:GITHUB_RUN_NUMBER)"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Publish app (self-contained, single file)
        shell: pwsh
        run: >
          dotnet publish src/SmithtonLivestreamGuide/SmithtonLivestreamGuide.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}

      - name: Locate Inno Setup
        id: inno
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          echo "iscc=$iscc" >> $env:GITHUB_OUTPUT

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "${{ steps.inno.outputs.iscc }}" `
            /DMyAppVersion="${{ steps.version.outputs.version }}" `
            /DPublishDir="$PWD\src\SmithtonLivestreamGuide\bin\Release\net8.0-windows\win-x64\publish" `
            installer\setup.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Smithton Livestream Guide ${{ steps.version.outputs.version }}
          files: dist/*.exe
          generate_release_notes: true
